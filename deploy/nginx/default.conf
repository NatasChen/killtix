# TicketDesk — front proxy (docker-compose service "nginx").
# Listens on HTTP and forwards everything to the app container; the app itself is not
# published on the host. Security headers (CSP, HSTS, …) come from the app, not from here.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Logo uploads are base64 JSON: a 512 KB PNG is ~700 KB on the wire.
    client_max_body_size 2m;

    # Resolve "app" through Docker's DNS on each request (valid 10 s) instead of once at
    # start-up, so a recreated app container with a new IP is picked up without a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:8080;

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append ($proxy_add_x_forwarded_for): the app trusts the FIRST
        # entry (TRUST_PROXY=true), so a client-supplied header would spoof the login
        # rate limit and audit-log IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
