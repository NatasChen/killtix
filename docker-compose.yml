# ============================================================================
#  TicketDesk — Docker Compose (nginx + app + PostgreSQL 16 + Redis 7)
#  Usage:  scripts/init-env.sh  &&  docker compose up -d --build --wait
#  The database schema is created by the app's migrations on start-up.
#  Only nginx publishes a port (HTTP, ${HTTP_PORT:-80}); it forwards to app:8080 on the
#  internal network. The app, PostgreSQL and Redis are not published on the host.
#  See docs/DEPLOYMENT_GUIDE.md.
# ============================================================================
name: ticketdesk

services:
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  app:
    build: .
    image: ticketdesk:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL:-http://localhost}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required (at least 32 characters)}
      DATABASE_URL: postgres://${POSTGRES_USER:-ticketdesk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ticketdesk}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TZ: ${TZ:-Asia/Taipei}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh-TW}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@ticket.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      AGING_DIGEST_HOUR: ${AGING_DIGEST_HOUR:-9}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-TicketDesk <no-reply@ticket.local>}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
    # No published port: only nginx reaches the app (app:8080 on the internal network).
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketdesk}
      POSTGRES_USER: ${POSTGRES_USER:-ticketdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

volumes:
  pgdata:
  redisdata:

networks:
  internal:
